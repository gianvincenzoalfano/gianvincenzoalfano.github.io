<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Chi sostiene chi?</title>
<style>
  :root {
    --bg:#0d1016; --bg2:#121620; --card:#161b25; --card2:#1b2130; --fg:#e8ebf1; --muted:#98a1b3; --line:#262d3b;
    --acc:#6aa6ff; --acc2:#3d7be0; --accbg:#1a2740; --in:#0f131b;
    --ok:#4cd18a; --okbg:#122219; --warn:#f4b860; --warnbg:#231c10; --err:#ff6b6b;
    --r:14px; --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.25);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:radial-gradient(1200px 600px at 80% -10%, #16203a 0%, transparent 60%), var(--bg);
         color:var(--fg); font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif; min-height:100vh; }
  .top { position:sticky; top:0; z-index:20; backdrop-filter:blur(10px); background:rgba(13,16,22,.82); border-bottom:1px solid var(--line); }
  .top .in { max-width:1280px; margin:0 auto; padding:10px 20px; display:flex; align-items:center; gap:12px; }
  .logo { width:34px; height:34px; border-radius:9px; background:linear-gradient(135deg,var(--acc),var(--acc2)); display:grid; place-items:center; font-weight:700; color:#fff; font-size:1.15rem; flex:none; }
  .top h1 { font-size:1.05rem; margin:0; font-weight:600; }
  .top .sub { color:var(--muted); font-size:.82rem; }
  .spazio { flex:1; }
  .chip { display:flex; align-items:center; gap:8px; padding:5px 6px 5px 12px; border:1px solid var(--line); border-radius:999px; background:var(--bg2); font-size:.85rem; }
  .chip .k { font:600 .95rem ui-monospace,Menlo,Consolas,monospace; letter-spacing:.06em; }
  button { font:inherit; padding:10px 18px; border:0; border-radius:10px; background:var(--acc2); color:#fff; cursor:pointer; transition:filter .15s, transform .05s; }
  button:hover:not(:disabled) { filter:brightness(1.12); }
  button:active:not(:disabled) { transform:translateY(1px); }
  button.sec { background:transparent; border:1px solid var(--line); color:var(--fg); }
  button.mini { padding:4px 10px; font-size:.8rem; border-radius:999px; }
  button.grande { font-size:1.05rem; padding:12px 26px; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .wrap { max-width:1280px; margin:0 auto; padding:24px 20px 96px; }
  .stretto { max-width:660px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:20px; margin-bottom:16px; box-shadow:var(--shadow); }
  h2 { font-size:1.15rem; margin:0 0 8px; }
  h3 { font-size:1rem; margin:0 0 6px; }
  .muted { color:var(--muted); font-size:.9rem; }
  .pre { white-space:pre-wrap; }
  .msg { margin-top:10px; min-height:1.4em; font-size:.92rem; }
  .err { color:var(--err); }
  .anon { background:var(--okbg); border-color:#24452f; }
  .anon h3 { color:var(--ok); }
  .racc { background:var(--warnbg); border-color:#4a3a1c; }
  .racc h3 { color:var(--warn); }
  .racc ul { margin:8px 0 12px; padding-left:20px; }
  .racc li { margin:4px 0; }
  .impegno { display:flex; gap:10px; align-items:flex-start; padding:12px; border-radius:10px; background:rgba(0,0,0,.2); cursor:pointer; }
  .impegno input { width:18px; height:18px; accent-color:var(--warn); margin-top:2px; flex:none; }
  input[type=text] { width:100%; padding:11px 12px; font:inherit; border-radius:10px; border:1px solid var(--line); background:var(--in); color:var(--fg); }
  input[type=text]:focus { outline:2px solid var(--acc); outline-offset:0; border-color:transparent; }
  .riga { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }

  .layout { display:grid; gap:24px; grid-template-columns:1fr; }
  @media (min-width: 980px) {
    .layout { grid-template-columns:minmax(0,5fr) minmax(0,6fr); align-items:start; }
    .testo { position:sticky; top:76px; max-height:calc(100vh - 96px); overflow:auto; }
    #fabTesto { display:none !important; }
  }
  .testo { background:var(--card2); }
  .testo .etichetta { color:var(--acc); font-size:.78rem; font-weight:600; text-transform:uppercase; letter-spacing:.08em; margin-bottom:6px; }
  .testo h2 { font-size:1.25rem; }
  .righe { margin-top:10px; }
  .riga-d { display:grid; grid-template-columns:30px 1fr; gap:8px; padding:7px 0; border-top:1px solid rgba(255,255,255,.05); font-size:.95rem; }
  .riga-d:first-child { border-top:0; }
  .riga-d .num { color:var(--muted); font:500 .8rem ui-monospace,Menlo,Consolas,monospace; text-align:right; padding-top:3px; }
  .riga-d .chi { font-weight:650; color:var(--acc); font-size:.82rem; text-transform:uppercase; letter-spacing:.03em; }
  .riga-d.mod .chi { color:var(--muted); }

  .testa { display:flex; justify-content:space-between; align-items:flex-end; gap:12px; margin-bottom:10px; flex-wrap:wrap; }
  .testa .n { font-size:1.3rem; font-weight:650; }
  .stato { font-size:.85rem; color:var(--muted); }
  .stato.err { color:var(--err); }
  .progresso { height:6px; border-radius:99px; background:var(--line); overflow:hidden; margin-bottom:18px; }
  .progresso div { height:100%; width:0; background:linear-gradient(90deg,var(--acc2),var(--acc)); transition:width .3s; }
  .promemoria { font-size:.85rem; color:var(--warn); background:var(--warnbg); border:1px solid #4a3a1c; border-radius:10px; padding:8px 12px; margin-bottom:16px; }
  .nuovoCodice { background:var(--accbg); border-color:#2c4677; }
  .nuovoCodice .k { font:700 1.6rem ui-monospace,Menlo,Consolas,monospace; letter-spacing:.1em; color:#fff; margin:6px 0 10px; }
  .esito { background:var(--okbg); border-color:#24452f; color:var(--ok); }

  .q .badge { display:inline-grid; place-items:center; min-width:28px; height:28px; border-radius:8px; background:var(--acc2); color:#fff; font-weight:700; font-size:.85rem; margin-right:10px; padding:0 6px; }
  .q .qt { display:flex; align-items:flex-start; font-weight:600; margin-bottom:6px; font-size:1.05rem; }
  .q .qt span.t { padding-top:1px; }
  .q.controllo { border-color:#4a3a1c; }
  .q.controllo .badge { background:var(--warn); color:#1b1306; }
  .tag { display:inline-block; font-size:.72rem; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:1px 8px; margin:0 0 6px 38px; }
  .citazione { margin:8px 0 4px; padding:8px 12px; border-left:3px solid var(--warn); background:rgba(0,0,0,.18); border-radius:0 8px 8px 0; font-size:.95rem; }
  .opts { display:flex; flex-direction:column; gap:8px; margin-top:12px; }
  .opts label { display:flex; gap:12px; align-items:flex-start; padding:11px 14px; border:1px solid var(--line); border-radius:10px; cursor:pointer; background:var(--in); transition:border-color .15s, background .15s; }
  .opts label:hover { border-color:#3a4458; }
  .opts label.scelta { border-color:var(--acc); background:var(--accbg); }
  .opts input { accent-color:var(--acc); margin-top:4px; }
  .celle { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:8px; margin-top:12px; }
  .cella { padding:11px 8px; text-align:center; border:1px solid var(--line); border-radius:10px; cursor:pointer; user-select:none; background:var(--in); transition:background .12s, border-color .12s; }
  .cella:hover { border-color:#3a4458; }
  .cella.on { background:var(--acc2); border-color:var(--acc); color:#fff; }
  .nota { color:var(--muted); font-size:.82rem; margin-top:8px; }
  .azioni { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:16px; flex-wrap:wrap; }
  .ro .cella, .ro label { cursor:default; }
  .giusta { outline:2px solid var(--ok); outline-offset:1px; }
  .sbagliata { outline:2px solid var(--err); outline-offset:1px; }
  .rivedi .q { padding:16px 20px; }

  #fabTesto { position:fixed; right:16px; bottom:18px; z-index:30; border-radius:999px; padding:12px 18px; box-shadow:0 8px 24px rgba(0,0,0,.45); }
  #foglio { position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.55); display:flex; align-items:flex-end; }
  #foglio .pannello { width:100%; max-height:82vh; overflow:auto; background:var(--card2); border-radius:18px 18px 0 0; padding:18px 20px 28px; border-top:1px solid var(--line); }
  #foglio .chiudi { position:sticky; top:0; float:right; }
  @media (max-width: 620px) {
    .top .in { padding:8px 12px; gap:8px; }
    .top .sub, .logo, #btnCopia, .chip > span:first-child { display:none; }
    .chip { padding:5px 10px; }
    .top h1 { font-size:.98rem; }
    .wrap { padding:16px 12px 96px; }
    .card { padding:16px; }
  }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="top">
  <div class="in">
    <div class="logo" aria-hidden="true">⇄</div>
    <div><h1 data-t="titolo"></h1><div class="sub" data-t="corso"></div></div>
    <div class="spazio"></div>
    <div class="chip hidden" id="chip"><span data-t="codiceBreve"></span> <span class="k" id="chipCodice"></span>
      <button class="sec mini" id="btnCopia" data-t="copiaLink"></button></div>
    <button class="sec mini" id="btnLingua"></button>
  </div>
</div>

<div class="wrap">
  <!-- Schermata iniziale -->
  <section id="home" class="stretto">
    <div class="card anon"><h3 data-t="anonTitolo"></h3><div data-t="anonTesto"></div></div>

      <h2 data-t="primaVolta"></h2>

      <div id="msgNuovo" class="msg"></div>
    </div>
    <div class="card">
      <h2 data-t="giaCodice"></h2>
      <div class="riga">
        <input id="inCodice" type="text" placeholder="ABCD-EFGH" autocomplete="off" autocapitalize="characters" style="max-width:220px">
        <button id="btnRiprendi" class="sec" data-t="riprendi"></button>
      </div>
      <div id="msgRiprendi" class="msg"></div>
    </div>
  </section>

  <!-- Questionario -->
  <section id="quiz" class="hidden">
    <div class="layout">
      <aside class="card testo" id="testo"></aside>
      <div>
        <div class="card nuovoCodice hidden" id="nuovoCodice">

          <div style="margin-top:12px"><button id="btnAnnotato" data-t="annotato"></button></div>
        </div>
        <div class="testa">
          <div><div class="n" id="titoloDom"></div><div class="muted" id="contatore"></div></div>
          <span id="stato" class="stato"></span>
        </div>
        <div class="progresso"><div id="barra"></div></div>
        <div class="promemoria" id="promemoria" data-t="promemoria"></div>
        <div id="passo"></div>
        <div id="rivedi" class="rivedi ro"></div>
        <button class="sec" id="btnEsci" data-t="esci"></button>
      </div>
    </div>
  </section>
</div>

<button id="fabTesto" class="hidden" data-t="mostraTesto"></button>
<div id="foglio" class="hidden"><div class="pannello"><button class="sec mini chiudi" id="btnChiudiFoglio" data-t="chiudi"></button><div id="foglioTesto"></div></div></div>

<script>
// URL dell'app web Apps Script (termina con /exec)
const API_URL = 'https://script.google.com/macros/s/AKfycbwZU4c-v4UuYf670VSgaTaDWeua_GGeqSmh-NxHOs-ag0JfaUsRJPPILkmGjXDPTsbIkA/exec';

/* ---------- testi dell'interfaccia (modificabili) ---------- */

    ],
    impegno: 'Ho letto le raccomandazioni e mi impegno a rispettarle.',
    primaVolta: 'Prima volta?', primaVoltaNota: 'Premendo il pulsante ricevi il tuo dibattito e il tuo codice personale.',
    inizia: 'Inizia', giaCodice: 'Hai già un codice?', riprendi: 'Riprendi',

    annotato: 'Ho annotato il codice',
    dibattito: 'Dibattito', domanda: 'Domanda', di: 'di',
    avanzamento: 'Domanda {k} di {n}', completato: 'Tutte le domande completate',
    avanti: 'Avanti', bloccata: 'Dopo «Avanti» la risposta non si può più modificare.',
    salvato: 'Risposta salvata', salvataggio: 'Salvataggio…',
    controlloTitolo: 'Domanda di controllo',
    controlloCoppia: 'Ripensa alla domanda {k}. Tra queste due opzioni, quale è una risposta corretta?',
    controlloConferma: 'Ripensa alla domanda {k}. «{a}» è una risposta corretta?',
    vero: 'Vero', falso: 'Falso',
    promemoria: 'Lavora individualmente e senza strumenti esterni.',
    fineTitolo: 'Hai risposto a tutte le domande',
    disponibileDomanda: 'Ultima cosa: saresti disponibile a partecipare a un altro questionario simile, su un altro testo?',
    si: 'Sì', no: 'No',
    invia: 'Invia il questionario', invioNota: 'Dopo l\'invio potrai rivedere le risposte con il tuo codice.',
    inviatoMsg: 'Questionario inviato il {t}. Grazie per la partecipazione!',
    chiuso: 'Il questionario è chiuso: puoi rivedere le risposte date, ma non continuare.',
    legenda: ' I bordi verdi indicano le risposte corrette, quelli rossi le scelte errate.',
    rivediTitolo: 'Le tue risposte',
    selCat: { speaker: 'Seleziona uno o più speaker.', stato: 'Seleziona uno o più stati.', luogo: 'Seleziona uno o più luoghi.',
              nazione: 'Seleziona uno o più paesi o aree.', partito: 'Seleziona uno o più partiti.' },
    cat: { speaker: 'Speaker', stato: 'Stato', luogo: 'Luogo', nazione: 'Paese o area', partito: 'Partito', bool: 'Vero o falso' },
    tradotto: 'Traduzione dall\'inglese: in caso di dubbio fa fede il testo originale (pulsante «English» in alto).',
    esci: 'Usa un altro codice', esciConferma: 'Vuoi uscire da questo codice? Le risposte restano salvate, ma per tornarci ti servirà il codice {c}.',
    mostraTesto: 'Mostra il dibattito', chiudi: 'Chiudi', attendere: 'Attendere…', caricamento: 'Caricamento…',
    err: {
      codice: 'Codice non trovato: controlla di averlo scritto correttamente.', chiuso: 'Il questionario è chiuso.',
      nonImportate: 'Il questionario non è ancora pronto.', richiesta: 'Richiesta non valida: ricarica la pagina.',
      rete: 'Errore di connessione, riprova.', inviato: 'Il questionario è già stato inviato.',
      aula: 'Per iniziare usa il QR code mostrato a lezione.', occupato: 'Il server è molto occupato: riprova tra qualche secondo.',
      passo: 'La pagina era rimasta indietro: ho ripreso dal punto corretto.'
    }
  },
  en: {
    titolo: 'Who backs whom?', corso: 'Read a debate and work out who attacks and who supports whom', altraLingua: 'Italiano',
    anonTitolo: 'Anonymous questionnaire',
    anonTesto: 'We do not ask for your name, student ID or email, and we do not store any data that identifies you. Your answers are linked only to a random personal code that only you can see.',
    raccTitolo: 'Guidelines',
    racc: [
      'Please take this seriously: each student receives a specific debate, and the answers are recorded and analysed.',
      'Read the debate carefully. Questions come one at a time and, after "Next", an answer can no longer be changed.',
      'Some questions are checks: always answer consistently with what you said before.',
      'Work on your own, without discussing with other students.',
      'Do not use AI tools, search engines or unauthorised material.',
      'Do not share your personal code or the text of the debate.',
      'Press "Start" only once: every new access takes a place meant for a classmate. If you stop, you can resume the questionnaire at any time, as long as you have your personal code.'
    ],
    impegno: 'I have read the guidelines and commit to following them.',
    primaVolta: 'First time?', primaVoltaNota: 'Press the button to receive your debate and your personal code.',
    inizia: 'Start', giaCodice: 'Already have a code?', riprendi: 'Resume',
    codiceBreve: 'Code', copiaLink: 'Copy link', linkCopiato: 'Copied',
    tuoCodice: 'Your personal code',
    annotaCodice: 'Write it down or take a screenshot: you need it to resume or review your answers, even from another device. Without it your answers cannot be recovered.',
    annotato: 'I have saved my code',
    dibattito: 'Debate', domanda: 'Question', di: 'of',
    avanzamento: 'Question {k} of {n}', completato: 'All questions completed',
    avanti: 'Next', bloccata: 'After "Next" the answer can no longer be changed.',
    salvato: 'Answer saved', salvataggio: 'Saving…',
    controlloTitolo: 'Check question',
    controlloCoppia: 'Think again about question {k}. Which of these two options is a correct answer?',
    controlloConferma: 'Think again about question {k}. Is "{a}" a correct answer?',
    vero: 'True', falso: 'False',
    promemoria: 'Work individually and without external tools.',
    fineTitolo: 'You have answered all the questions',
    disponibileDomanda: 'One last thing: would you be willing to take part in another similar questionnaire, on a different text?',
    si: 'Yes', no: 'No',
    invia: 'Submit the questionnaire', invioNota: 'After submitting you can review your answers with your code.',
    inviatoMsg: 'Questionnaire submitted on {t}. Thank you for taking part!',
    chiuso: 'The questionnaire is closed: you can review the answers you gave, but not continue.',
    legenda: ' Green borders mark the correct answers, red borders the wrong choices.',
    rivediTitolo: 'Your answers',
    selCat: { speaker: 'Select one or more speakers.', stato: 'Select one or more states.', luogo: 'Select one or more places.',
              nazione: 'Select one or more countries or areas.', partito: 'Select one or more parties.' },
    cat: { speaker: 'Speaker', stato: 'State', luogo: 'Place', nazione: 'Country or area', partito: 'Party', bool: 'True or false' },
    tradotto: 'Translated text: if in doubt, the original prevails.',
    esci: 'Use a different code', esciConferma: 'Leave this code? Your answers stay saved, but you will need the code {c} to come back.',
    mostraTesto: 'Show the debate', chiudi: 'Close', attendere: 'Please wait…', caricamento: 'Loading…',
    err: {
      codice: 'Code not found: check that you typed it correctly.', chiuso: 'The questionnaire is closed.',
      nonImportate: 'The questionnaire is not ready yet.', richiesta: 'Invalid request: please reload the page.',
      rete: 'Connection error, please try again.', inviato: 'The questionnaire has already been submitted.',
      aula: 'To start, use the QR code shown in class.', occupato: 'The server is very busy: please try again in a few seconds.',
      passo: 'The page was out of date: resumed from the right point.'
    }
  }
};

const $ = id => document.getElementById(id);
const S = { codice: null, dati: null, lingua: null, appenaCreato: false, bozza: null, invio: false };

function leggi(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function scrivi(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
S.lingua = leggi('lingua') || ((navigator.language || 'it').toLowerCase().startsWith('it') ? 'it' : 'en');
const L = () => UI[S.lingua];

// codice aula: arriva dal link del QR (?a=...) e resta memorizzato in questo browser
const AULA = (() => {
  const a = new URLSearchParams(location.search).get('a');
  try { if (a) localStorage.setItem('codiceAula', a); return a || localStorage.getItem('codiceAula') || ''; } catch (e) { return a || ''; }
})();
if (new URLSearchParams(location.search).has('a')) history.replaceState(null, '', location.pathname + location.hash);

async function api(body) {
  if (body.azione === 'nuovo') body = Object.assign({ aula: AULA }, body);
  for (let tentativo = 0; ; tentativo++) {          // se il server è occupato riprova da solo
    let r;
    try {
      r = await (await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })).json();
    } catch (e) { r = { errore: 'rete' }; }
    if (!['occupato', 'rete'].includes(r.errore) || tentativo >= 6) return r;
    await new Promise(ok => setTimeout(ok, 800 + Math.random() * 1500 * (tentativo + 1)));
  }
}
const erroreTesto = c => L().err[c] || L().err.richiesta;
function el(tag, cls, testo) { const e = document.createElement(tag); if (cls) e.className = cls; if (testo != null) e.textContent = testo; return e; }
function mostra(id) { ['home', 'quiz'].forEach(s => $(s).classList.toggle('hidden', s !== id)); }
function dataOra(iso) { return new Date(iso).toLocaleString(S.lingua === 'it' ? 'it-IT' : 'en-GB', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }); }
function linkPersonale() { return location.origin + location.pathname + '#' + S.codice; }
function stato(testo, err) { $('stato').textContent = testo || ''; $('stato').className = 'stato' + (err ? ' err' : ''); }

/* ---------- lingua ---------- */
function applicaLingua() {
  document.documentElement.lang = S.lingua;
  document.title = L().titolo;
  document.querySelectorAll('[data-t]').forEach(n => { n.textContent = L()[n.dataset.t]; });
  $('btnLingua').textContent = L().altraLingua;
  const ul = $('raccLista'); ul.innerHTML = '';
  L().racc.forEach(t => ul.appendChild(el('li', null, t)));
  if (S.dati) disegna();
}
$('btnLingua').onclick = () => { S.lingua = S.lingua === 'it' ? 'en' : 'it'; scrivi('lingua', S.lingua); applicaLingua(); };

/* ---------- avvio e accesso ---------- */
(function avvio() {
  applicaLingua();
  const c = decodeURIComponent(location.hash.slice(1)) || leggi('codiceEsercitazione');
  if (c) carica(c, $('msgRiprendi'));
})();

$('chkImpegno').onchange = () => { $('btnNuovo').disabled = !$('chkImpegno').checked; };
$('btnNuovo').onclick = async () => {
  const box = $('msgNuovo');
  $('btnNuovo').disabled = true; box.textContent = L().attendere; box.className = 'msg';
  const r = await api({ azione: 'nuovo' });
  if (r.errore) { box.textContent = erroreTesto(r.errore); box.className = 'msg err'; $('btnNuovo').disabled = false; return; }
  box.textContent = ''; S.appenaCreato = true; apri(r);
};
$('btnRiprendi').onclick = () => carica($('inCodice').value, $('msgRiprendi'));
$('inCodice').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnRiprendi').click(); });

async function carica(codice, box) {
  box.textContent = L().caricamento; box.className = 'msg';
  const r = await api({ azione: 'carica', codice });
  if (r.errore) {
    box.textContent = erroreTesto(r.errore); box.className = 'msg err';
    if (r.errore === 'codice') scrivi('codiceEsercitazione', null);
    mostra('home'); return;
  }
  box.textContent = ''; apri(r);
}

$('btnCopia').onclick = async () => {
  try { await navigator.clipboard.writeText(linkPersonale()); $('btnCopia').textContent = L().linkCopiato; setTimeout(() => $('btnCopia').textContent = L().copiaLink, 1500); }
  catch (e) { prompt(L().copiaLink, linkPersonale()); }
};
$('btnAnnotato').onclick = () => { S.appenaCreato = false; $('nuovoCodice').classList.add('hidden'); };
$('btnEsci').onclick = () => {
  if (!confirm(L().esciConferma.replace('{c}', S.codice))) return;
  scrivi('codiceEsercitazione', null); history.replaceState(null, '', location.pathname); location.reload();
};

/* ---------- testo sempre a portata di mano ---------- */
$('fabTesto').onclick = () => { $('foglioTesto').innerHTML = $('testo').innerHTML; $('foglio').classList.remove('hidden'); };
$('btnChiudiFoglio').onclick = () => $('foglio').classList.add('hidden');
$('foglio').onclick = e => { if (e.target.id === 'foglio') $('foglio').classList.add('hidden'); };
new IntersectionObserver(([e]) => { $('fabTesto').classList.toggle('hidden', e.isIntersecting || !S.dati); }).observe($('testo'));

/* ---------- rendering ---------- */
function apri(r) {
  const passoPrima = S.dati && S.dati.stato ? S.dati.stato.passo + S.dati.stato.fase : null;
  S.codice = r.codice; S.dati = r;
  if (passoPrima !== r.stato.passo + r.stato.fase) S.bozza = null;
  scrivi('codiceEsercitazione', r.codice);
  history.replaceState(null, '', location.pathname + '#' + r.codice);
  mostra('quiz');
  disegna();
}

const T = (orig, tradotto) => (S.lingua === S.dati.lingua || !S.dati.tr ? orig : (tradotto || orig));
function blocco(i) {
  const b0 = S.dati.blocchi[i], t = (S.dati.tr && S.dati.tr.blocchi[i]) || {};
  return Object.assign({}, b0, { testo: T(b0.testo, t.testo), opzioni: b0.opzioni.map((o, j) => T(o, t.opzioni && t.opzioni[j])) });
}

function disegna() {
  const r = S.dati, st = r.stato, n = r.blocchi.length;
  $('chip').classList.remove('hidden'); $('chipCodice').textContent = r.codice;
  $('nuovoCodice').classList.toggle('hidden', !S.appenaCreato); $('nuovoCodiceK').textContent = r.codice;
  $('titoloDom').textContent = L().dibattito + ' ' + r.domanda;
  const fatte = Math.min(st.passo, n);
  $('contatore').textContent = st.fase === 'fine' ? L().completato : L().avanzamento.replace('{k}', st.passo + 1).replace('{n}', n);
  $('barra').style.width = (100 * fatte / n) + '%';
  disegnaTesto();

  const attivo = r.aperto && !r.inviato;
  $('promemoria').classList.toggle('hidden', !attivo || st.fase === 'fine');
  const box = $('passo'); box.innerHTML = '';
  if (r.inviato) box.appendChild(avviso(L().inviatoMsg.replace('{t}', dataOra(r.inviato)) + (r.soluzioni ? L().legenda : '')));
  else if (!r.aperto) box.appendChild(avviso(L().chiuso + (r.soluzioni ? L().legenda : '')));
  else if (st.fase === 'domanda') box.appendChild(cartaDomanda(st.passo));
  else if (st.fase === 'controllo') box.appendChild(cartaControllo(st.passo));
  else box.appendChild(cartaFine());

  // riepilogo delle risposte già date (sempre in sola lettura)
  const rv = $('rivedi'); rv.innerHTML = '';
  const date = r.blocchi.map((_, i) => i).filter(i => st.risposte[i] !== null && st.risposte[i] !== undefined);
  if (!attivo && date.length) {
    rv.appendChild(el('h3', null, L().rivediTitolo));
    date.forEach(i => rv.appendChild(cartaRiepilogo(i)));
  }
}

function disegnaTesto() {
  const r = S.dati, tr = r.tr || {}, tx = $('testo');
  tx.innerHTML = '';
  tx.appendChild(el('div', 'etichetta', L().dibattito + ' ' + r.domanda));
  tx.appendChild(el('h2', null, T(r.titolo, tr.titolo)));
  const lista = el('div', 'righe');
  r.righe.forEach((rr, k) => {
    const t = (tr.righe || [])[k] || {};
    const riga = el('div', 'riga-d' + (rr.chi === 'Moderator' ? ' mod' : '')), corpo = el('div');
    corpo.append(el('div', 'chi', T(rr.chi, t.chi)), el('div', null, T(rr.testo, t.testo)));
    riga.append(el('div', 'num', String(k + 1)), corpo);
    lista.appendChild(riga);
  });
  tx.appendChild(lista);
  if (S.lingua !== r.lingua && r.tr) { const n = el('div', 'muted', L().tradotto); n.style.marginTop = '12px'; tx.appendChild(n); }
}

function avviso(testo) { const c = el('div', 'card esito', testo); return c; }

function intestazione(c, numero, testo, cat) {
  const qt = el('div', 'qt');
  qt.append(el('span', 'badge', numero), el('span', 't pre', testo));
  c.appendChild(qt);
  if (cat) c.appendChild(el('div', 'tag', cat));
}

/* Domanda corrente: si risponde, poi «Avanti». */
function cartaDomanda(i) {
  const b = blocco(i), c = el('div', 'card q');
  intestazione(c, String(i + 1), b.testo, L().cat[b.categoria]);
  if (!S.bozza || S.bozza.i !== i) S.bozza = { i, v: b.tipo === 'singola' ? null : [] };
  const pronto = () => b.tipo === 'singola' ? S.bozza.v !== null : S.bozza.v.length > 0;
  const btn = el('button', 'grande', L().avanti);
  const aggiorna = () => { btn.disabled = !pronto() || S.invio; };
  if (b.tipo === 'singola') c.appendChild(radio(b.opzioni, () => S.bozza.v, j => { S.bozza.v = j; aggiorna(); }));
  else {
    c.appendChild(celle(b.opzioni, () => S.bozza.v, j => { S.bozza.v = S.bozza.v.includes(j) ? S.bozza.v.filter(x => x !== j) : S.bozza.v.concat(j); aggiorna(); }));
    c.appendChild(el('div', 'nota', L().selCat[b.categoria] || ''));
  }
  const az = el('div', 'azioni');
  az.append(el('span', 'nota', L().bloccata), btn);
  c.appendChild(az);
  aggiorna();
  btn.onclick = () => passo({ azione: 'rispondi', q: i, risposta: S.bozza.v }, btn);
  return c;
}

/* Domanda di controllo sulla domanda i (opzioni decise dal server). */
function cartaControllo(i) {
  const b = blocco(i), k = S.dati.stato.controlli[i], c = el('div', 'card q controllo');
  const testo = k.formato === 'coppia' ? L().controlloCoppia.replace('{k}', i + 1)
                                      : L().controlloConferma.replace('{k}', i + 1).replace('{a}', b.opzioni[k.a]);
  intestazione(c, '✓', testo, L().controlloTitolo);
  c.appendChild(el('div', 'citazione', b.testo));
  if (!S.bozza || S.bozza.i !== 'c' + i) S.bozza = { i: 'c' + i, v: null };
  const valori = k.formato === 'coppia' ? k.ordine : [0, 1];
  const etichette = k.formato === 'coppia' ? k.ordine.map(j => b.opzioni[j]) : [L().vero, L().falso];
  const btn = el('button', 'grande', L().avanti);
  c.appendChild(radio(etichette, () => valori.indexOf(S.bozza.v) < 0 ? null : valori.indexOf(S.bozza.v), j => { S.bozza.v = valori[j]; btn.disabled = S.invio; }));
  const az = el('div', 'azioni');
  az.append(el('span', 'nota', L().bloccata), btn);
  c.appendChild(az);
  btn.disabled = S.bozza.v === null;
  btn.onclick = () => passo({ azione: 'controllo', q: i, scelta: S.bozza.v }, btn);
  return c;
}

/* Fine: disponibilità per un altro questionario e invio. */
function cartaFine() {
  const c = el('div', 'card');
  c.appendChild(el('h2', null, L().fineTitolo));
  c.appendChild(el('p', null, L().disponibileDomanda));
  if (!S.bozza || S.bozza.i !== 'fine') S.bozza = { i: 'fine', v: null };
  const btn = el('button', 'grande', L().invia);
  c.appendChild(radio([L().si, L().no], () => S.bozza.v === null ? null : (S.bozza.v ? 0 : 1), j => { S.bozza.v = j === 0; btn.disabled = S.invio; }));
  const az = el('div', 'azioni');
  az.append(el('span', 'nota', L().invioNota), btn);
  c.appendChild(az);
  btn.disabled = S.bozza.v === null;
  btn.onclick = () => passo({ azione: 'invia', disponibile: S.bozza.v }, btn);
  return c;
}

/* Riepilogo in sola lettura di una risposta data. */
function cartaRiepilogo(i) {
  const b = blocco(i), x = S.dati.stato.risposte[i], c = el('div', 'card q');
  intestazione(c, String(i + 1), b.testo, L().cat[b.categoria]);
  const segna = (nodo, scelto, j) => {
    if (!S.dati.soluzioni) return;
    const giusto = b.tipo === 'singola' ? b.corretta === j : (b.corrette || []).includes(j);
    if (giusto) nodo.classList.add('giusta'); else if (scelto) nodo.classList.add('sbagliata');
  };
  if (b.tipo === 'singola') c.appendChild(radio(b.opzioni, () => x, null, segna));
  else c.appendChild(celle(b.opzioni, () => x || [], null, segna));
  return c;
}

function radio(etichette, valore, cambia, segna) {
  const w = el('div', 'opts'), nome = 'r' + Math.random().toString(36).slice(2);
  etichette.forEach((o, j) => {
    const l = el('label'), inp = el('input');
    inp.type = 'radio'; inp.name = nome; inp.checked = valore() === j; inp.disabled = !cambia;
    l.classList.toggle('scelta', valore() === j);
    inp.onchange = () => { cambia(j); w.querySelectorAll('label').forEach((x, k) => x.classList.toggle('scelta', k === j)); };
    l.append(inp, el('span', null, o));
    if (segna) segna(l, valore() === j, j);
    w.appendChild(l);
  });
  return w;
}

function celle(etichette, valore, cambia, segna) {
  const w = el('div', 'celle');
  etichette.forEach((o, j) => {
    const c = el('div', 'cella', o), on = () => valore().includes(j);
    c.classList.toggle('on', on());
    if (cambia) c.onclick = () => { cambia(j); c.classList.toggle('on', on()); };
    if (segna) segna(c, on(), j);
    w.appendChild(c);
  });
  return w;
}

/* Invia un passo al server e ridisegna con lo stato restituito. */
async function passo(corpo, btn) {
  if (S.invio) return;
  S.invio = true; btn.disabled = true; stato(L().salvataggio);
  const r = await api(Object.assign({ codice: S.codice }, corpo));
  S.invio = false;
  if (r.errore && !r.stato) {
    stato(erroreTesto(r.errore), true); btn.disabled = false;
    if (r.errore === 'inviato' || r.errore === 'chiuso') carica(S.codice, $('msgRiprendi'));
    return;
  }
  stato(r.errore === 'passo' ? L().err.passo : L().salvato, r.errore === 'passo');
  S.appenaCreato = false;
  apri(r);
  document.querySelector('.layout > div').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
</script>
</body>
</html>
