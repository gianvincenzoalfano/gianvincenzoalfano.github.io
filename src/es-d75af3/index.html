<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Chi sostiene chi?</title>
<style>
  :root {
    --bg:#0d1016; --bg2:#121620; --card:#161b25; --card2:#1b2130; --fg:#e8ebf1; --muted:#98a1b3; --line:#262d3b;
    --acc:#6aa6ff; --acc2:#3d7be0; --accbg:#1a2740; --in:#0f131b;
    --ok:#4cd18a; --okbg:#122219; --warn:#f4b860; --warnbg:#231c10; --err:#ff6b6b;
    --r:14px; --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.25);
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; background:radial-gradient(1200px 600px at 80% -10%, #16203a 0%, transparent 60%), var(--bg);
         color:var(--fg); font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif; min-height:100vh; }

  /* barra superiore */
  .top { position:sticky; top:0; z-index:20; backdrop-filter:blur(10px); background:rgba(13,16,22,.82); border-bottom:1px solid var(--line); }
  .top .in { max-width:1280px; margin:0 auto; padding:10px 20px; display:flex; align-items:center; gap:12px; }
  .logo { width:34px; height:34px; border-radius:9px; background:linear-gradient(135deg,var(--acc),var(--acc2)); display:grid; place-items:center; font-weight:700; color:#fff; font-size:1.15rem; flex:none; }
  .top h1 { font-size:1.05rem; margin:0; font-weight:600; }
  .top .sub { color:var(--muted); font-size:.82rem; }
  .spazio { flex:1; }
  .chip { display:flex; align-items:center; gap:8px; padding:5px 6px 5px 12px; border:1px solid var(--line); border-radius:999px; background:var(--bg2); font-size:.85rem; }
  .chip .k { font:600 .95rem ui-monospace,Menlo,Consolas,monospace; letter-spacing:.06em; }

  button { font:inherit; padding:10px 18px; border:0; border-radius:10px; background:var(--acc2); color:#fff; cursor:pointer; transition:filter .15s, transform .05s; }
  button:hover:not(:disabled) { filter:brightness(1.12); }
  button:active:not(:disabled) { transform:translateY(1px); }
  button.sec { background:transparent; border:1px solid var(--line); color:var(--fg); }
  button.mini { padding:4px 10px; font-size:.8rem; border-radius:999px; }
  button:disabled { opacity:.45; cursor:not-allowed; }

  .wrap { max-width:1280px; margin:0 auto; padding:24px 20px 96px; }
  .stretto { max-width:660px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:20px; margin-bottom:16px; box-shadow:var(--shadow); }
  h2 { font-size:1.15rem; margin:0 0 8px; }
  h3 { font-size:1rem; margin:0 0 6px; }
  .muted { color:var(--muted); font-size:.9rem; }
  .pre { white-space:pre-wrap; }
  .msg { margin-top:10px; min-height:1.4em; font-size:.92rem; }
  .err { color:var(--err); }

  .anon { background:var(--okbg); border-color:#24452f; }
  .anon h3 { color:var(--ok); }
  .racc { background:var(--warnbg); border-color:#4a3a1c; }
  .racc h3 { color:var(--warn); }
  .racc ul { margin:8px 0 12px; padding-left:20px; }
  .racc li { margin:4px 0; }
  .impegno { display:flex; gap:10px; align-items:flex-start; padding:12px; border-radius:10px; background:rgba(0,0,0,.2); cursor:pointer; }
  .impegno input { width:18px; height:18px; accent-color:var(--warn); margin-top:2px; flex:none; }
  input[type=text], textarea { width:100%; padding:11px 12px; font:inherit; border-radius:10px; border:1px solid var(--line); background:var(--in); color:var(--fg); }
  input[type=text]:focus, textarea:focus { outline:2px solid var(--acc); outline-offset:0; border-color:transparent; }
  textarea { min-height:120px; resize:vertical; }
  .riga { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }

  /* layout del questionario */
  .layout { display:grid; gap:24px; grid-template-columns:1fr; }
  @media (min-width: 980px) {
    .layout { grid-template-columns:minmax(0,5fr) minmax(0,6fr); align-items:start; }
    .testo { position:sticky; top:76px; max-height:calc(100vh - 96px); overflow:auto; }
    #fabTesto { display:none !important; }
  }
  .testo { background:var(--card2); }
  .testo .etichetta { color:var(--acc); font-size:.78rem; font-weight:600; text-transform:uppercase; letter-spacing:.08em; margin-bottom:6px; }
  .testo h2 { font-size:1.25rem; }
  .testo img { max-width:100%; border-radius:10px; background:#fff; margin:10px 0 4px; }

  .testa { display:flex; justify-content:space-between; align-items:flex-end; gap:12px; margin-bottom:10px; flex-wrap:wrap; }
  .testa .n { font-size:1.3rem; font-weight:650; }
  .stato { font-size:.85rem; color:var(--muted); }
  .stato.err { color:var(--err); }
  .stato.ok::before { content:"●"; color:var(--ok); margin-right:6px; font-size:.7rem; vertical-align:2px; }
  .progresso { height:6px; border-radius:99px; background:var(--line); overflow:hidden; margin-bottom:18px; }
  .progresso div { height:100%; width:0; background:linear-gradient(90deg,var(--acc2),var(--acc)); transition:width .3s; }
  .promemoria { font-size:.85rem; color:var(--warn); background:var(--warnbg); border:1px solid #4a3a1c; border-radius:10px; padding:8px 12px; margin-bottom:16px; }
  .nuovoCodice { background:var(--accbg); border-color:#2c4677; }
  .nuovoCodice .k { font:700 1.6rem ui-monospace,Menlo,Consolas,monospace; letter-spacing:.1em; color:#fff; margin:6px 0 10px; }

  .q { position:relative; }
  .righe { margin-top:10px; }
  .riga-d { display:grid; grid-template-columns:30px 1fr; gap:8px; padding:7px 0; border-top:1px solid rgba(255,255,255,.05); font-size:.95rem; }
  .riga-d:first-child { border-top:0; }
  .riga-d .num { color:var(--muted); font:500 .8rem ui-monospace,Menlo,Consolas,monospace; text-align:right; padding-top:3px; }
  .riga-d .chi { font-weight:650; color:var(--acc); font-size:.82rem; text-transform:uppercase; letter-spacing:.03em; }
  .riga-d.mod .chi { color:var(--muted); }
  .tag { display:inline-block; font-size:.72rem; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:1px 8px; margin:0 0 6px 38px; }
  .completo { font-size:.9rem; border-radius:10px; padding:9px 12px; margin-bottom:16px; }
  .completo.si { color:var(--ok); background:var(--okbg); border:1px solid #24452f; }
  .completo.no { color:var(--muted); background:var(--bg2); border:1px solid var(--line); }
  .invio { text-align:center; }
  #btnInvia { font-size:1.05rem; padding:13px 28px; background:linear-gradient(135deg,var(--acc2),#5b5be0); }
  .inviato { background:var(--okbg); border-color:#24452f; color:var(--ok); }
  .anteprima { background:#2a1630; border:1px solid #5b2d66; color:#f0c4ff; border-radius:10px; padding:8px 12px; margin-bottom:16px; font-size:.88rem; }
  .q .badge { display:inline-grid; place-items:center; min-width:28px; height:28px; border-radius:8px; background:var(--accbg); color:var(--acc); font-weight:700; font-size:.85rem; margin-right:10px; padding:0 6px; }
  .q .qt { display:flex; align-items:flex-start; font-weight:600; margin-bottom:6px; }
  .q .qt span.t { padding-top:2px; }
  .q.fatto .badge { background:var(--acc2); color:#fff; }
  .info { background:transparent; box-shadow:none; border-style:dashed; }
  .info img { max-width:100%; border-radius:10px; background:#fff; margin-top:8px; }

  .opts { display:flex; flex-direction:column; gap:8px; margin-top:10px; }
  .opts label { display:flex; gap:12px; align-items:flex-start; padding:11px 14px; border:1px solid var(--line); border-radius:10px; cursor:pointer; background:var(--in); transition:border-color .15s, background .15s; }
  .opts label:hover { border-color:#3a4458; }
  .opts label.scelta { border-color:var(--acc); background:var(--accbg); }
  .opts input { accent-color:var(--acc); margin-top:4px; }
  .celle { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:8px; margin-top:10px; }
  .cella { padding:11px 8px; text-align:center; border:1px solid var(--line); border-radius:10px; cursor:pointer; user-select:none; background:var(--in); transition:background .12s, border-color .12s; }
  .cella:hover { border-color:#3a4458; }
  .cella.on { background:var(--acc2); border-color:var(--acc); color:#fff; }
  .griglia { overflow-x:auto; margin-top:10px; }
  table { border-collapse:separate; border-spacing:6px; }
  th { font-weight:500; color:var(--muted); font-size:.88rem; padding:4px; }
  th.r { text-align:left; color:var(--fg); }
  td.cella { min-width:64px; height:42px; }
  .nota { color:var(--muted); font-size:.82rem; margin-top:8px; }
  .giusta { outline:2px solid var(--ok); outline-offset:1px; }
  .sbagliata { outline:2px solid var(--err); outline-offset:1px; }
  .ro .cella, .ro label { cursor:default; }

  /* testo a scomparsa su schermi stretti */
  #fabTesto { position:fixed; right:16px; bottom:18px; z-index:30; border-radius:999px; padding:12px 18px; box-shadow:0 8px 24px rgba(0,0,0,.45); }
  #foglio { position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.55); display:flex; align-items:flex-end; }
  #foglio .pannello { width:100%; max-height:82vh; overflow:auto; background:var(--card2); border-radius:18px 18px 0 0; padding:18px 20px 28px; border-top:1px solid var(--line); }
  #foglio .chiudi { position:sticky; top:0; float:right; }
  @media (max-width: 620px) {
    .top .in { padding:8px 12px; gap:8px; }
    .top .sub, .logo, #btnCopia, .chip > span:first-child { display:none; }
    .chip { padding:5px 10px; }
    .top h1 { font-size:.98rem; }
    .wrap { padding:16px 12px 96px; }
    .card { padding:16px; }
  }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="top">
  <div class="in">
    <div class="logo" aria-hidden="true">⇄</div>
    <div>
      <h1 data-t="titolo"></h1>
      <div class="sub" data-t="corso"></div>
    </div>
    <div class="spazio"></div>
    <div class="chip hidden" id="chip"><span data-t="codiceBreve"></span> <span class="k" id="chipCodice"></span>
      <button class="sec mini" id="btnCopia" data-t="copiaLink"></button></div>
    <button class="sec mini" id="btnLingua"></button>
  </div>
</div>

<div class="wrap">
  <div class="anteprima hidden" id="bannerAnteprima" data-t="anteprima"></div>
  <!-- Schermata iniziale -->
  <section id="home" class="stretto">
    <div class="card anon"><h3 data-t="anonTitolo"></h3><div data-t="anonTesto"></div></div>

    <div class="card racc">
      <h3 data-t="raccTitolo"></h3>
      <ul id="raccLista"></ul>
      <label class="impegno"><input type="checkbox" id="chkImpegno"><span data-t="impegno"></span></label>
    </div>

    <div class="card">
      <h2 data-t="primaVolta"></h2>
      <p class="muted" data-t="primaVoltaNota"></p>
      <button id="btnNuovo" data-t="inizia" disabled></button>
      <div id="msgNuovo" class="msg"></div>
    </div>

    <div class="card">
      <h2 data-t="giaCodice"></h2>
      <div class="riga">
        <input id="inCodice" type="text" placeholder="ABCD-EFGH" autocomplete="off" autocapitalize="characters" style="max-width:220px">
        <button id="btnRiprendi" class="sec" data-t="riprendi"></button>
      </div>
      <div id="msgRiprendi" class="msg"></div>
    </div>
  </section>

  <!-- Questionario -->
  <section id="quiz" class="hidden">
    <div class="layout">
      <aside class="card testo" id="testo"></aside>
      <div>
        <div class="card nuovoCodice hidden" id="nuovoCodice">
          <h3 data-t="tuoCodice"></h3>
          <div class="k" id="nuovoCodiceK"></div>
          <div class="muted" data-t="annotaCodice"></div>
          <div style="margin-top:12px"><button id="btnAnnotato" data-t="annotato"></button></div>
        </div>
        <div class="card hidden" id="chiuso"></div>
        <div class="testa">
          <div><div class="n" id="titoloDom"></div><div class="muted" id="contatore"></div></div>
          <span id="stato" class="stato"></span>
        </div>
        <div class="progresso"><div id="barra"></div></div>
        <div class="promemoria" id="promemoria" data-t="promemoria"></div>
        <div class="completo" id="completo"></div>
        <div id="blocchi"></div>
        <div class="card invio" id="zonaInvio">
          <button id="btnInvia" data-t="invia" disabled></button>
          <div class="muted" style="margin-top:10px" data-t="invioNota"></div>
          <div id="msgInvia" class="msg"></div>
        </div>
        <p class="muted" id="notaSalva" data-t="notaSalva"></p>
        <button class="sec" id="btnEsci" data-t="esci"></button>
      </div>
    </div>
  </section>
</div>

<button id="fabTesto" class="hidden" data-t="mostraTesto"></button>
<div id="foglio" class="hidden"><div class="pannello"><button class="sec mini chiudi" id="btnChiudiFoglio" data-t="chiudi"></button><div id="foglioTesto"></div></div></div>

const $ = id => document.getElementById(id);
const S = { codice: null, dati: null, risposte: [], aperto: true, timer: null, inVolo: false, pendente: false,
            stato: null, lingua: null, appenaCreato: false };

function leggi(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function scrivi(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
S.lingua = leggi('lingua') || ((navigator.language || 'it').toLowerCase().startsWith('it') ? 'it' : 'en');
const L = () => UI[S.lingua];

const ANTEPRIMA = /INCOLLA/.test(API_URL);
// codice aula: arriva dal link del QR (?a=...) e resta memorizzato in questo browser
const AULA = (() => {
  const a = new URLSearchParams(location.search).get('a');
  try { if (a) localStorage.setItem('codiceAula', a); return a || localStorage.getItem('codiceAula') || ''; } catch (e) { return a || ''; }
})();
if (new URLSearchParams(location.search).has('a')) history.replaceState(null, '', location.pathname + location.hash);

async function api(body, keepalive) {
  if (ANTEPRIMA) return apiAnteprima(body);
  if (body.azione === 'nuovo') body = Object.assign({ aula: AULA }, body);
  // se il server è occupato (molti studenti insieme) riprova da solo
  for (let tentativo = 0; ; tentativo++) {
    const r = await apiUnaVolta(body, keepalive);
    if (r.errore !== 'occupato' || tentativo >= 6 || keepalive) return r;
    await new Promise(ok => setTimeout(ok, 800 + Math.random() * 1500 * (tentativo + 1)));
  }
}
async function apiUnaVolta(body, keepalive) {
  // text/plain evita la richiesta preflight CORS, che Apps Script non gestisce
  const r = await fetch(API_URL, { method: 'POST', keepalive: !!keepalive,
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  return r.json();
}
/* Backend simulato per l'anteprima: dati senza soluzioni in anteprima.js, risposte nel localStorage. */
async function apiAnteprima(body) {
  if (!window.DATI_ANTEPRIMA) await new Promise((ok, ko) => {
    const sc = document.createElement('script'); sc.src = 'anteprima.js'; sc.onload = ok; sc.onerror = ko; document.head.appendChild(sc);
  });
  const db = JSON.parse(leggi('anteprimaDb') || '{}');
  const pacchetto = (codice) => {
    const v = db[codice], d = window.DATI_ANTEPRIMA[v.n - 1];
    return { codice, domanda: v.n, aperto: true, soluzioni: false, lingua: 'en', titolo: d.titolo, descrizione: '',
             righe: d.righe, blocchi: d.blocchi, tr: d.tr, risposte: v.risposte, salvato: v.salvato, inviato: v.inviato || '' };
  };
  if (body.azione === 'nuovo') {
    const n = Object.keys(db).length % window.DATI_ANTEPRIMA.length + 1;
    const codice = 'DEMO-' + 'ABCDEFGHJK'.charAt(n - 1) + 'AAA';
    db[codice] = db[codice] || { n, risposte: null, salvato: '' };
    scrivi('anteprimaDb', JSON.stringify(db));
    return pacchetto(codice);
  }
  const c = String(body.codice || '').toUpperCase().trim();
  if (!db[c]) return { errore: 'codice' };
  if (body.azione === 'carica') return pacchetto(c);
  if (db[c].inviato) return { errore: 'inviato' };
  if (body.azione === 'invia') {
    const d = window.DATI_ANTEPRIMA[db[c].n - 1];
    if (!d.blocchi.every((b, i) => risposto(b, body.risposte[i]))) return { errore: 'incompleto' };
    db[c].inviato = new Date().toISOString();
  }
  db[c].risposte = body.risposte; db[c].salvato = new Date().toISOString();
  scrivi('anteprimaDb', JSON.stringify(db));
  return { ok: true, salvato: db[c].salvato, inviato: db[c].inviato };
}

const erroreTesto = c => L().err[c] || L().err.richiesta;
function el(tag, cls, testo) { const e = document.createElement(tag); if (cls) e.className = cls; if (testo != null) e.textContent = testo; return e; }
function mostra(id) { ['home', 'quiz'].forEach(s => $(s).classList.toggle('hidden', s !== id)); }
function ora(iso) { return new Date(iso).toLocaleTimeString(S.lingua === 'it' ? 'it-IT' : 'en-GB', { hour: '2-digit', minute: '2-digit' }); }
function dataOra(iso) { return new Date(iso).toLocaleString(S.lingua === 'it' ? 'it-IT' : 'en-GB', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }); }
function linkPersonale() { return location.origin + location.pathname + '#' + S.codice; }

/* stato del salvataggio, memorizzato come chiave per seguire il cambio di lingua */
function setStato(chiave, extra, tipo) { S.stato = chiave ? { chiave, extra, tipo } : null; disegnaStato(); }
function disegnaStato() {
  const s = S.stato, n = $('stato');
  n.textContent = !s ? '' : (s.tipo === 'srv' ? erroreTesto(s.chiave) : L()[s.chiave] + (s.extra ? ' ' + s.extra : ''));
  n.className = 'stato' + (s && (s.tipo === 'err' || s.tipo === 'srv') ? ' err' : '') + (s && s.chiave === 'salvatoAlle' ? ' ok' : '');
}

/* ---------- lingua ---------- */
function applicaLingua() {
  document.documentElement.lang = S.lingua;
  document.title = L().titolo + ' · ' + L().corso;
  document.querySelectorAll('[data-t]').forEach(n => { n.textContent = L()[n.dataset.t]; });
  $('btnLingua').textContent = L().altraLingua;
  const ul = $('raccLista'); ul.innerHTML = '';
  L().racc.forEach(t => ul.appendChild(el('li', null, t)));
  if (S.dati) disegna(); else disegnaStato();
}
$('btnLingua').onclick = () => { S.lingua = S.lingua === 'it' ? 'en' : 'it'; scrivi('lingua', S.lingua); applicaLingua(); };

/* ---------- avvio e accesso ---------- */
(function avvio() {
  applicaLingua();
  $('bannerAnteprima').classList.toggle('hidden', !ANTEPRIMA);
  const c = decodeURIComponent(location.hash.slice(1)) || leggi('codiceEsercitazione');
  if (c) carica(c, $('msgRiprendi'));
})();

$('chkImpegno').onchange = () => { $('btnNuovo').disabled = !$('chkImpegno').checked; };

$('btnNuovo').onclick = async () => {
  const box = $('msgNuovo');
  $('btnNuovo').disabled = true;
  box.textContent = L().attendere; box.className = 'msg';
  try {
    const r = await api({ azione: 'nuovo' });
    if (r.errore) throw { srv: r.errore };
    box.textContent = '';
    S.appenaCreato = true;
    apri(r);
  } catch (e) {
    box.textContent = e.srv ? erroreTesto(e.srv) : L().err.rete; box.className = 'msg err';
    $('btnNuovo').disabled = false;
  }
};

$('btnRiprendi').onclick = () => carica($('inCodice').value, $('msgRiprendi'));
$('inCodice').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnRiprendi').click(); });

async function carica(codice, box) {
  box.textContent = L().caricamento; box.className = 'msg';
  try {
    const r = await api({ azione: 'carica', codice });
    if (r.errore) throw { srv: r.errore };
    box.textContent = '';
    apri(r);
  } catch (e) {
    box.textContent = e.srv ? erroreTesto(e.srv) : L().err.rete; box.className = 'msg err';
    if (e.srv === 'codice') scrivi('codiceEsercitazione', null);
    mostra('home');
  }
}

$('btnCopia').onclick = async () => {
  try { await navigator.clipboard.writeText(linkPersonale()); $('btnCopia').textContent = L().linkCopiato; setTimeout(() => $('btnCopia').textContent = L().copiaLink, 1500); }
  catch (e) { prompt(L().copiaLink, linkPersonale()); }
};
$('btnAnnotato').onclick = () => { S.appenaCreato = false; $('nuovoCodice').classList.add('hidden'); };
$('btnEsci').onclick = () => {
  if (!confirm(L().esciConferma.replace('{c}', S.codice))) return;
  scrivi('codiceEsercitazione', null); history.replaceState(null, '', location.pathname); location.reload();
};

/* ---------- testo sempre a portata di mano ---------- */
$('fabTesto').onclick = () => { $('foglioTesto').innerHTML = $('testo').innerHTML; $('foglio').classList.remove('hidden'); };
$('btnChiudiFoglio').onclick = () => $('foglio').classList.add('hidden');
$('foglio').onclick = e => { if (e.target.id === 'foglio') $('foglio').classList.add('hidden'); };
new IntersectionObserver(([e]) => {
  $('fabTesto').classList.toggle('hidden', e.isIntersecting || !S.dati);
}).observe($('testo'));

/* ---------- rendering ---------- */
function apri(r) {
  S.codice = r.codice; S.dati = r; S.aperto = r.aperto && !r.inviato;
  S.risposte = r.risposte || r.blocchi.map(vuota);
  scrivi('codiceEsercitazione', r.codice);
  history.replaceState(null, '', location.pathname + '#' + r.codice);
  if (r.inviato) setStato('inviatoStato');
  else if (r.salvato) setStato('salvatoAlle', ora(r.salvato)); else setStato(r.aperto ? 'nessunSalvataggio' : null);
  mostra('quiz');
  disegna();
  window.scrollTo(0, 0);
}

/* Testo nella lingua scelta: originale se coincide con la lingua del Form, altrimenti traduzione. */
function T(orig, tradotto) { return S.lingua === S.dati.lingua || !S.dati.tr ? orig : (tradotto || orig); }

function disegna() {
  const r = S.dati, tr = r.tr || { blocchi: [] };
  $('chip').classList.remove('hidden');
  $('chipCodice').textContent = r.codice;
  $('nuovoCodice').classList.toggle('hidden', !S.appenaCreato);
  $('nuovoCodiceK').textContent = r.codice;
  $('titoloDom').textContent = L().domanda + ' ' + r.domanda;
  disegnaStato();

  const ch = $('chiuso');
  ch.classList.toggle('hidden', S.aperto);
  ch.classList.toggle('inviato', !!r.inviato);
  ch.textContent = S.aperto ? '' : (r.inviato ? L().inviatoMsg.replace('{t}', dataOra(r.inviato)) : L().chiuso) + (r.soluzioni ? L().legenda : '');
  $('notaSalva').classList.toggle('hidden', !S.aperto);
  $('promemoria').classList.toggle('hidden', !S.aperto);
  $('zonaInvio').classList.toggle('hidden', !S.aperto);

  // blocchi tradotti
  const blocchi = r.blocchi.map((b0, i) => {
    const t = tr.blocchi[i] || {};
    return Object.assign({}, b0, {
      testo: T(b0.testo, t.testo), aiuto: T(b0.aiuto, t.aiuto),
      opzioni: b0.opzioni && b0.opzioni.map((o, j) => T(o, t.opzioni && t.opzioni[j])),
      righe: b0.righe && b0.righe.map((o, j) => T(o, t.righe && t.righe[j])),
      colonne: b0.colonne && b0.colonne.map((o, j) => T(o, t.colonne && t.colonne[j]))
    });
  });
  const primo = blocchi.findIndex(b => b.risposta);

  // colonna del testo: titolo, descrizione e blocchi informativi prima del primo quesito
  const tx = $('testo');
  tx.innerHTML = '';
  tx.appendChild(el('div', 'etichetta', L().domanda + ' ' + r.domanda));
  if (r.titolo) tx.appendChild(el('h2', null, T(r.titolo, tr.titolo)));
  if (r.descrizione) tx.appendChild(el('div', 'pre', T(r.descrizione, tr.descrizione)));
  blocchi.slice(0, primo).forEach(b => informativo(b, tx));
  if (r.righe) {
    const tr2 = (tr.righe || []);
    const lista = el('div', 'righe');
    r.righe.forEach((rr, k) => {
      const t = tr2[k] || {};
      const riga = el('div', 'riga-d' + (rr.chi === 'Moderator' ? ' mod' : ''));
      const corpo = el('div');
      corpo.append(el('div', 'chi', T(rr.chi, t.chi)), el('div', null, T(rr.testo, t.testo)));
      riga.append(el('div', 'num', String(k + 1)), corpo);
      lista.appendChild(riga);
    });
    tx.appendChild(lista);
  }
  if (S.lingua !== r.lingua && r.tr) { const n = el('div', 'muted', L().tradotto); n.style.marginTop = '12px'; tx.appendChild(n); }

  // colonna dei quesiti
  const box = $('blocchi');
  box.innerHTML = '';
  box.classList.toggle('ro', !S.aperto);
  let nq = 0;
  blocchi.forEach((b, i) => {
    if (i < primo) return;
    const c = el('div', 'card q');
    if (!b.risposta) { c.classList.add('info'); informativo(b, c); box.appendChild(c); return; }
    c.dataset.i = i;
    const qt = el('div', 'qt');
    qt.append(el('span', 'badge', String(++nq)), el('span', 't pre', b.testo || L().quesito + ' ' + nq));
    c.appendChild(qt);
    if (b.categoria) c.appendChild(el('div', 'tag', L().cat[b.categoria]));
    if (b.aiuto) c.appendChild(el('div', 'muted pre', b.aiuto));
    if (b.tipo === 'singola') c.appendChild(singola(b, i));
    if (b.tipo === 'multipla') c.appendChild(multipla(b, i));
    if (b.tipo === 'griglia') c.appendChild(griglia(b, i));
    if (b.tipo === 'aperta') c.appendChild(aperta(b, i));
    box.appendChild(c);
  });
  progresso();
}

function informativo(b, dove) {
  if (b.testo) dove.appendChild(el('h3', 'pre', b.testo));
  if (b.aiuto) dove.appendChild(el('div', 'pre', b.aiuto));
  if (b.tipo === 'immagine') { const im = el('img'); im.src = b.src; im.alt = b.testo || ''; dove.appendChild(im); }
}

function risposto(b, x) {
  if (b.tipo === 'singola') return x !== null && x !== undefined;
  if (b.tipo === 'multipla') return x.length > 0;
  if (b.tipo === 'griglia') return x.some(v => Array.isArray(v) ? v.length : v !== null);
  return !!(x && String(x).trim());
}

function progresso() {
  const bl = S.dati.blocchi;
  let tot = 0, fatti = 0;
  bl.forEach((b, i) => {
    if (!b.risposta) return;
    tot++;
    const ok = risposto(b, S.risposte[i]);
    if (ok) fatti++;
    const c = document.querySelector('.q[data-i="' + i + '"]');
    if (c) c.classList.toggle('fatto', ok);
  });
  $('contatore').textContent = L().risposte + ': ' + fatti + '/' + tot;
  const cp = $('completo');
  cp.className = 'completo ' + (fatti === tot ? 'si' : 'no');
  cp.textContent = fatti === tot ? L().completoSi : L().completoNo.replace('{k}', tot - fatti);
  cp.classList.toggle('hidden', !S.aperto);
  $('btnInvia').disabled = fatti !== tot;
  $('barra').style.width = (tot ? 100 * fatti / tot : 0) + '%';
}

function vuota(b) {
  if (!b.risposta || b.tipo === 'singola') return null;
  if (b.tipo === 'multipla') return [];
  if (b.tipo === 'griglia') return b.righe.map(() => b.multipla ? [] : null);
  return '';
}

function segna(nodo, scelto, giusto) {
  if (!S.dati.soluzioni || giusto === undefined) return;
  if (giusto) nodo.classList.add('giusta'); else if (scelto) nodo.classList.add('sbagliata');
}

function singola(b, i) {
  const w = el('div', 'opts');
  b.opzioni.forEach((o, j) => {
    const l = el('label'), inp = el('input');
    inp.type = 'radio'; inp.name = 'b' + i; inp.checked = S.risposte[i] === j; inp.disabled = !S.aperto;
    inp.onchange = () => { S.risposte[i] = j; w.querySelectorAll('label').forEach((x, k) => x.classList.toggle('scelta', k === j)); modificato(); };
    l.classList.toggle('scelta', S.risposte[i] === j);
    l.append(inp, el('span', null, o));
    segna(l, S.risposte[i] === j, b.corretta === undefined ? undefined : b.corretta === j);
    w.appendChild(l);
  });
  return w;
}

function multipla(b, i) {
  const w = el('div', 'celle');
  b.opzioni.forEach((o, j) => {
    const c = el('div', 'cella', o), on = () => S.risposte[i].includes(j);
    c.classList.toggle('on', on());
    c.onclick = () => {
      if (!S.aperto) return;
      S.risposte[i] = on() ? S.risposte[i].filter(x => x !== j) : S.risposte[i].concat(j);
      c.classList.toggle('on', on()); modificato();
    };
    segna(c, on(), b.corrette === undefined ? undefined : b.corrette.includes(j));
    w.appendChild(c);
  });
  const f = document.createDocumentFragment(); f.append(w, el('div', 'nota', (b.categoria && L().sel[b.categoria]) || L().selTutte)); return f;
}

function griglia(b, i) {
  const w = el('div', 'griglia'), t = el('table'), hr = el('tr');
  hr.appendChild(el('th'));
  b.colonne.forEach(c => hr.appendChild(el('th', null, c)));
  t.appendChild(hr);
  b.righe.forEach((riga, k) => {
    const tr = el('tr');
    tr.appendChild(el('th', 'r', riga));
    const celle = b.colonne.map((_, j) => {
      const td = el('td', 'cella');
      td.onclick = () => {
        if (!S.aperto) return;
        if (b.multipla) {
          const s = S.risposte[i][k];
          S.risposte[i][k] = s.includes(j) ? s.filter(x => x !== j) : s.concat(j);
        } else {
          S.risposte[i][k] = S.risposte[i][k] === j ? null : j;
        }
        aggiorna(); modificato();
      };
      tr.appendChild(td);
      return td;
    });
    const aggiorna = () => celle.forEach((td, j) => {
      const v = S.risposte[i][k];
      td.classList.toggle('on', b.multipla ? v.includes(j) : v === j);
    });
    aggiorna();
    t.appendChild(tr);
  });
  w.appendChild(t);
  const f = document.createDocumentFragment(); f.append(w, el('div', 'nota', b.multipla ? L().selTutte : L().selRiga)); return f;
}

function aperta(b, i) {
  const x = el(b.lunga ? 'textarea' : 'input');
  if (!b.lunga) x.type = 'text';
  x.value = S.risposte[i] || ''; x.disabled = !S.aperto; x.maxLength = 5000;
  x.oninput = () => { S.risposte[i] = x.value; modificato(); };
  x.style.marginTop = '10px';
  return x;
}

/* ---------- invio definitivo ---------- */
$('btnInvia').onclick = async () => {
  if (!confirm(L().confermaInvio)) return;
  clearTimeout(S.timer); S.timer = null;
  const box = $('msgInvia');
  $('btnInvia').disabled = true;
  box.textContent = L().attendere; box.className = 'msg';
  try {
    const r = await api({ azione: 'invia', codice: S.codice, risposte: S.risposte });
    if (r.errore) throw { srv: r.errore };
    box.textContent = '';
    S.dati.inviato = r.inviato; S.dati.salvato = r.salvato;
    S.aperto = false;
    setStato('inviatoStato');
    disegna();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (e) {
    box.textContent = e.srv ? erroreTesto(e.srv) : L().err.rete; box.className = 'msg err';
    $('btnInvia').disabled = false;
  }
};

/* ---------- salvataggio automatico ---------- */
function modificato() {
  progresso();
  setStato('nonSalvate');
  clearTimeout(S.timer);
  S.timer = setTimeout(salva, 1200);
}

async function salva(keepalive) {
  clearTimeout(S.timer); S.timer = null;
  if (S.inVolo) { S.pendente = true; return; }
  S.inVolo = true;
  setStato('salvataggio');
  try {
    const r = await api({ azione: 'salva', codice: S.codice, risposte: S.risposte }, keepalive);
    if (r.errore) {
      setStato(r.errore, '', 'srv');
      if (r.errore === 'chiuso' || r.errore === 'inviato') { const c = await api({ azione: 'carica', codice: S.codice }); if (!c.errore) apri(c); }
    } else setStato('salvatoAlle', ora(r.salvato));
  } catch (e) {
    setStato('nonSalvato', '', 'err');
    S.timer = setTimeout(salva, 4000);
  } finally {
    S.inVolo = false;
    if (S.pendente) { S.pendente = false; salva(); }
  }
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && S.timer) salva(true);
});
window.addEventListener('beforeunload', e => {
  if (S.timer || S.inVolo) { e.preventDefault(); e.returnValue = ''; }
});
</script>
